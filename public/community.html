<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="/js/theme.js"></script>
<title>Community Reports — HydroSense</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="hs-header"></div>
<main>
<div class="container section--tight">
  <span class="eyebrow">Community</span>
  <h2>Open reports near you</h2>
  <p style="max-width:680px;">See the same problem? Tap I See This Too instead of filing a duplicate. Reports that many neighbours confirm are raised in priority for the authorities. Reporter identities are never shown.</p>
  <div class="field" style="max-width:420px; margin-top:16px;"><input type="search" id="q" placeholder="Search by water body, issue or Report ID"></div>
  <div id="note"></div>
  <div id="list" class="grid-3" style="margin-top:18px;"></div>
  <div id="empty" class="card" style="display:none; margin-top:18px;"><p>No open reports yet.</p><p><a href="/report.html">Report an issue →</a></p></div>
</div>
</main>
<div id="hs-footer"></div>
<script src="/js/lang/ta.js"></script>
<script src="/js/core.js"></script>
<script src="/js/pages/community.js"></script>
</body>
</html>
